<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>Justdial Marketing Dashboard</title>

  <!-- Performance hints -->
  <link rel="dns-prefetch" href="//cdn.jsdelivr.net">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="//cdn.plot.ly">
  <link rel="preconnect" href="https://cdn.plot.ly" crossorigin>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />

  <!-- Custom stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

  {% block head_extra %}{% endblock %}
</head>
<body>
  <div class="container my-4">
    <h1 class="text-center mb-3">Justdial Dashboard</h1>
    <div id="tabs-content">
      {% block content %}{% endblock %}
    </div>
  </div>

  <!-- Bootstrap JS bundle -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>

  <!-- Global: loading state on submit -->
  <script>
    document.addEventListener('submit', function (e) {
      const form = e.target;
      const active = document.activeElement;
      const btn = (active && active.type === 'submit' && active.form === form)
        ? active : form.querySelector('button[type="submit"]');
      if (btn) {
        const original = btn.innerHTML;
        btn.dataset.original = original;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Processing...';
        setTimeout(() => {
          if (btn.disabled) {
            btn.disabled = false;
            btn.innerHTML = btn.dataset.original;
          }
        }, 3000);
      }
    }, true);
  </script>

  {% block scripts %}{% endblock %}
</body>
</html>
